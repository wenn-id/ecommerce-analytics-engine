services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-analytics-backend
    # No host port mapping: the backend is only reachable from inside the
    # compose network via the Next.js BFF proxy (#56). The frontend service
    # reaches it as http://backend:8080.
    environment:
      - PORT=8080
      - DB_PATH=/data/analytics.db
      - SYNC_INTERVAL_MINUTES=60
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - APP_ENV=production
      - API_KEY=${API_KEY:?Set API_KEY in .env before starting the stack (APP_ENV=production refuses an empty key)}
      # Trust the Docker bridge networks so X-Forwarded-For set by the Next.js
      # BFF container is honored for per-client rate limiting (#57).
      - TRUSTED_PROXY_CIDRS=127.0.0.1/8,::1/128,172.16.0.0/12
    volumes:
      - analytics_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-analytics-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8080/api/v1
      - API_KEY=${API_KEY:?Set API_KEY in .env before starting the stack}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  analytics_data:
    driver: local
