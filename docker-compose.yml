version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-analytics-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/analytics.db
      - SYNC_INTERVAL_MINUTES=60
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - API_KEY=
    volumes:
      - analytics_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-analytics-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8080/api/v1
      - API_KEY=
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  analytics_data:
    driver: local
